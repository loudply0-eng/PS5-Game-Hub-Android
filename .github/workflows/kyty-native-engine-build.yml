name: KytyPS5 Native Engine Build

on:
  pull_request:
    branches: [feat/kytyps5-engine-integration-20261124]
    paths:
      - ".gitmodules"
      - "engine/**"
      - ".github/workflows/kyty-native-engine-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kyty-native-engine-build
  cancel-in-progress: true

jobs:
  build-arm64-engine:
    name: Build real KytyPS5 ARM64 engine and Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NDK_VERSION: 28.2.13676358
      ENGINE_DIR: engine/KytyPS5-Android
    steps:
      - name: Checkout project and pinned upstream engine
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
          fetch-depth: 0
          persist-credentials: false

      - name: Check out maintained unified KytyPS5 fork
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$ENGINE_DIR"
          git clone --no-checkout https://github.com/loudply0-eng/KytyPS5-Android.git "$ENGINE_DIR"
          git -C "$ENGINE_DIR" checkout --detach dac144daa519ef7f3a0857a16d9bca7cb6289f42
          git -C "$ENGINE_DIR" submodule update --init --recursive
          test "$(git -C "$ENGINE_DIR" rev-parse HEAD)" = "dac144daa519ef7f3a0857a16d9bca7cb6289f42"
          git -C "$ENGINE_DIR" submodule status --recursive

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools ccache

      - name: Set up Java 21
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          set -o pipefail
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build pinned FFmpeg for Android ARM64
        working-directory: engine/KytyPS5-Android
        run: |
          set -Eeuo pipefail
          export ANDROID_NDK_HOME="$ANDROID_NDK"
          bash scripts/android/build-ffmpeg-android.sh "$PWD/_Build/ffmpeg-android"

      - name: Configure native engine
        working-directory: engine/KytyPS5-Android
        run: |
          set -Eeuo pipefail
          cmake -S . -B _Build/android -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-31 \
            -DCMAKE_BUILD_TYPE=Release \
            -DKYTY_GUEST_CPU_FEX=ON \
            -DKYTY_BUILD_LAUNCHER=OFF \
            -DFFMPEG_PREBUILT_DIR="$PWD/_Build/ffmpeg-android/install" \
            -DKYTY_BUILD_ORIGIN=Fork \
            -DKYTY_BUILD_REPOSITORY="$GITHUB_REPOSITORY" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Compile native emulator and Vulkan support
        working-directory: engine/KytyPS5-Android
        run: |
          set -Eeuo pipefail
          ccache --max-size=3G
          ninja -C _Build/android kyty_emulator
          test -s _Build/android/libmain.so
          test -s _Build/android/3rdparty/SDL3/libSDL3.so
          find _Build/android/3rdparty/libadrenotools/src/hook -maxdepth 1 -type f -name '*.so' -print -quit | grep -q .
          ccache --show-stats

      - name: Stage ARM64 native libraries
        shell: bash
        working-directory: engine/KytyPS5-Android
        run: |
          set -Eeuo pipefail
          ST="$RUNNER_TEMP/kyty-native"
          mkdir -p "$ST/3rdparty/SDL3" "$ST/3rdparty/libadrenotools/src/hook"
          STRIP="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          test -x "$STRIP"
          "$STRIP" --strip-debug -o "$ST/libmain.so" _Build/android/libmain.so
          cp _Build/android/3rdparty/SDL3/libSDL3.so "$ST/3rdparty/SDL3/"
          find _Build/android/3rdparty/libadrenotools/src/hook -maxdepth 1 -type f -name '*.so' -exec cp {} "$ST/3rdparty/libadrenotools/src/hook/" \;
          test -s "$ST/libmain.so"
          test -s "$ST/3rdparty/SDL3/libSDL3.so"

      - name: Run engine app tests and package APK
        working-directory: engine/KytyPS5-Android/android
        run: |
          set -Eeuo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew --no-daemon testDebugUnitTest assembleDebug \
            -PkytyNativeDir="$RUNNER_TEMP/kyty-native"

      - name: Verify APK contains native ARM64 libraries
        working-directory: engine/KytyPS5-Android/android
        run: |
          set -Eeuo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/lib(main|SDL3|hook_impl|main_hook|file_redirect_hook|gsl_alloc_hook)\.so'
          sha256sum "$APK" | tee "$RUNNER_TEMP/kytyps5-engine-apk.sha256"

      - name: Upload internal engine validation APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kytyps5-native-engine-validation
          path: |
            engine/KytyPS5-Android/android/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/kytyps5-engine-apk.sha256
          if-no-files-found: error
          retention-days: 7
